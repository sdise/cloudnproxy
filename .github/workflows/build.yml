name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  # 先跑编译与单元测试，失败就不再浪费构建机时
  check:
    name: 编译检查与单元测试
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      - name: 安装 Linux 依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            patchelf libssl-dev libgtk-3-dev build-essential

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust 缓存
        uses: Swatinem/rust-cache@v2

      - name: 引擎单元测试
        run: cargo test -p t5-core --lib

      - name: 无 GUI 版本单元测试
        run: cargo test -p t5-daemon

      - name: Web 控制台单元测试
        run: cargo test -p t5-web

      - name: 安装 Node
        uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: 安装 Tauri CLI
        run: npm install -g "@tauri-apps/cli@^2"

      # generate_context!() 在编译期就要读取图标，所以类型检查前必须先产出
      - name: 生成图标
        run: |
          node scripts/gen-icon.js icon-source.png
          tauri icon icon-source.png -o src-tauri/icons

      - name: 全量类型检查
        run: cargo check --workspace --all-targets

  # 真正启动无 GUI 版本，验证监听、日志与代理链路
  smoke:
    name: 无 GUI 版本冒烟测试
    needs: check
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust 缓存
        uses: Swatinem/rust-cache@v2

      # daemon 不依赖 WebView，因此这一步不需要任何图形库
      - name: 构建无 GUI 版本
        run: cargo build --release -p t5-daemon

      - name: 准备配置
        run: |
          mkdir -p /tmp/cnp
          cat > /tmp/cnp/config.toml <<'EOF'
          listen_host = "127.0.0.1"
          listen_port = 11080
          resolve_domain = "cloudnproxy.baidu.com"
          upstream = "163.177.17.189:443"
          fake_host = "cloudnproxy.baidu.com"
          t5_auth = "1050504963"
          chain_enabled = false
          chain_addr = ""
          tunnel_pool = true
          auto_reconnect = true
          auto_switch = false
          log_level = "info"
          log_file = "/tmp/cnp/t5d.log"

          [web]
          enabled = true
          listen = "127.0.0.1:10110"
          EOF

      - name: 启动并验证
        run: |
          set -o pipefail
          ./target/release/t5d -f /tmp/cnp/config.toml -log debug > /tmp/cnp/stdout.log 2>&1 &
          echo $! > /tmp/cnp/t5d.pid

          echo "=========== 端口就绪探测 ==========="
          echo "（节点解析已移到后台，端口应秒级就绪）"
          ready=0
          for i in $(seq 1 15); do
            if (ss -ltn 2>/dev/null || netstat -ltn) | grep -q 11080; then
              echo "端口在 ${i} 秒内就绪"
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            echo "::error::11080 端口未监听，daemon 未正常启动"
            cat /tmp/cnp/stdout.log
            exit 1
          fi

          echo "=========== 标准输出日志 ==========="
          cat /tmp/cnp/stdout.log

          echo "=========== 日志文件 ==========="
          if [ -s /tmp/cnp/t5d.log ]; then
            tail -n 15 /tmp/cnp/t5d.log
            echo "日志文件写入正常"
          else
            echo "::error::日志文件为空，log_file 未生效"; exit 1
          fi

          echo "=========== SOCKS5 连通性（软检查）==========="
          curl -s -m 12 --socks5-hostname 127.0.0.1:11080 http://ip-api.com/json/ \
            && echo "代理链路可用" \
            || echo "::warning::代理连通性未通过（CI 网络环境限制，不判定构建失败）"

          echo "=========== Web 控制台认证流程 ==========="
          BASE=http://127.0.0.1:10110

          code=$(curl -s -m 5 -o /dev/null -w '%{http_code}' -X POST "$BASE/api/rpc/get_status" \
            -H 'Content-Type: application/json' -d '{}')
          echo "① 未携带令牌访问业务接口：HTTP $code（期望 401）"
          [ "$code" = "401" ] || { echo "::error::未鉴权的请求没有被拒绝"; exit 1; }

          INIT_PWD=$(grep -o '初始密码：[^ ]*' /tmp/cnp/t5d.log | head -n1 | sed 's/初始密码：//')
          if [ -z "$INIT_PWD" ]; then
            echo "::error::未能从日志中取得初始密码"
            cat /tmp/cnp/t5d.log
            exit 1
          fi
          echo "② 已从日志取得随机初始密码：$INIT_PWD"

          LOGIN=$(curl -s -m 5 -X POST "$BASE/api/auth/login" \
            -H 'Content-Type: application/json' \
            -d "{\"username\":\"admin\",\"password\":\"$INIT_PWD\"}")
          TOKEN=$(echo "$LOGIN" | jq -r '.token // empty')
          MUST=$(echo "$LOGIN" | jq -r '.must_change_password')
          [ -n "$TOKEN" ] || { echo "::error::登录失败"; echo "$LOGIN"; exit 1; }
          [ "$MUST" = "true" ] || { echo "::error::首次登录应当要求修改密码"; exit 1; }
          echo "③ 登录成功，且标记为必须修改初始密码"

          code=$(curl -s -m 5 -o /dev/null -w '%{http_code}' -X POST "$BASE/api/rpc/get_status" \
            -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' -d '{}')
          echo "④ 未改密即访问业务接口：HTTP $code（期望 403）"
          [ "$code" = "403" ] || { echo "::error::未完成改密时不应放行业务接口"; exit 1; }

          CHANGED=$(curl -s -m 5 -X POST "$BASE/api/auth/change-password" \
            -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' \
            -d '{"new_password":"ci-smoke-password"}')
          TOKEN2=$(echo "$CHANGED" | jq -r '.token // empty')
          [ -n "$TOKEN2" ] || { echo "::error::修改密码失败"; echo "$CHANGED"; exit 1; }
          echo "⑤ 初始密码已修改"

          STATUS=$(curl -s -m 5 -X POST "$BASE/api/rpc/get_status" \
            -H "Authorization: Bearer $TOKEN2" -H 'Content-Type: application/json' -d '{}')
          echo "⑥ 改密后调用业务接口：$(echo "$STATUS" | jq -c '{running:.engine.running, nodes:.nodes, version:.version}')"
          echo "$STATUS" | jq -e '.engine.running' >/dev/null \
            || { echo "::error::业务接口返回异常"; echo "$STATUS"; exit 1; }

          code=$(curl -s -m 5 -o /dev/null -w '%{http_code}' -X POST "$BASE/api/auth/login" \
            -H 'Content-Type: application/json' \
            -d "{\"username\":\"admin\",\"password\":\"$INIT_PWD\"}")
          echo "⑦ 用旧密码登录：HTTP $code（期望 401）"
          [ "$code" = "401" ] || { echo "::error::旧密码修改后仍然可用"; exit 1; }

          code=$(curl -s -m 5 -o /dev/null -w '%{http_code}' "$BASE/")
          echo "⑧ 静态界面首页：HTTP $code（期望 200）"
          [ "$code" = "200" ] || { echo "::error::界面资源不可访问"; exit 1; }

          code=$(curl -s -m 5 -o /dev/null -w '%{http_code}' -X POST "$BASE/api/rpc/set_autostart" \
            -H "Authorization: Bearer $TOKEN2" -H 'Content-Type: application/json' -d '{"enabled":true}')
          echo "⑨ Web 端调用宿主专属命令：HTTP $code（期望 400，应被明确拒绝）"
          [ "$code" = "400" ] || { echo "::error::宿主专属命令未被拒绝"; exit 1; }

          echo "Web 控制台认证与鉴权流程全部通过"

          echo "=========== SSE 实时推送 ==========="
          # 前端速率图依赖 stats 事件；daemon 若忘记启动推送循环，这里会暴露。
          # 不要用管道退出码判断：grep 命中后会立即退出，curl 收到 SIGPIPE 返回
          # 141，在 set -o pipefail 下会被误判成失败。先把响应收进变量再判断。
          SSE=$(timeout 6 curl -sN -H "Authorization: Bearer $TOKEN2" "$BASE/api/events" 2>/dev/null || true)
          if printf '%s' "$SSE" | grep -q '"type":"stats"'; then
            echo "已在 SSE 流中收到 stats 事件"
            printf '%s\n' "$SSE" | grep -o '"type":"[a-z-]*"' | sort -u | head -n 5
          else
            echo "::error::6 秒内未收到 stats 事件，统计推送未工作"
            echo "----------- 实际收到的内容（前 400 字节）-----------"
            printf '%s' "$SSE" | head -c 400
            echo
            exit 1
          fi

          echo "=========== 优雅停止 ==========="
          kill -TERM "$(cat /tmp/cnp/t5d.pid)" 2>/dev/null || true
          sleep 2
          if kill -0 "$(cat /tmp/cnp/t5d.pid)" 2>/dev/null; then
            echo "::warning::daemon 未在 SIGTERM 后退出，强制结束"
            kill -9 "$(cat /tmp/cnp/t5d.pid)" 2>/dev/null || true
          else
            echo "已优雅退出"
          fi
          echo "--- 停止后的日志尾部 ---"
          tail -n 5 /tmp/cnp/stdout.log

      - name: 上传测试日志
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: daemon-smoke-logs
          path: /tmp/cnp/*.log
          if-no-files-found: ignore
          retention-days: 14

  # 桌面版必须单独验证：GUI 层的崩溃不会影响 t5d，也不会被上面的冒烟测试
  # 覆盖。0.2.0 就是这样带着「启动即闪退」发布出去的 —— 根因是 Tauri 的同步
  # setup 回调里调用了 tokio::spawn（那里没有 Tokio 运行时）。
  gui-smoke:
    name: 图形界面版本启动测试
    needs: check
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      - name: 安装 Linux 依赖与虚拟显示
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            patchelf libssl-dev libgtk-3-dev build-essential \
            xvfb dbus-x11

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust 缓存
        uses: Swatinem/rust-cache@v2

      - name: 安装 Node
        uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: 安装 Tauri CLI
        run: npm install -g "@tauri-apps/cli@^2"

      - name: 生成图标
        run: |
          node scripts/gen-icon.js icon-source.png
          tauri icon icon-source.png -o src-tauri/icons

      # 用 debug 构建：编译更快，且保留了完整输出，崩溃时能直接看到原因
      - name: 构建图形界面版
        run: cargo build -p cloudnproxy

      - name: 在虚拟显示下启动并观察
        run: |
          mkdir -p /tmp/gui
          # Xvfb 没有 GPU，关掉 WebKit 的合成与 dmabuf 渲染以免误判
          WEBKIT_DISABLE_COMPOSITING_MODE=1 WEBKIT_DISABLE_DMABUF_RENDERER=1 \
            xvfb-run -a dbus-run-session -- ./target/debug/cloudnproxy > /tmp/gui/app.log 2>&1 &
          PID=$!
          echo "已启动（PID $PID），观察 20 秒…"

          for i in $(seq 1 20); do
            if ! kill -0 "$PID" 2>/dev/null; then
              echo "::error::图形界面版在 ${i} 秒内退出，疑似启动即崩溃"
              echo "----------- 程序输出 -----------"
              cat /tmp/gui/app.log
              exit 1
            fi
            sleep 1
          done

          echo "进程已存活 20 秒"
          echo "----------- 程序输出 -----------"
          cat /tmp/gui/app.log

          echo "----------- 引擎自动就绪检查 -----------"
          if (ss -ltn 2>/dev/null || netstat -ltn) | grep -q 10801; then
            echo "SOCKS5 已在 10801 监听（autostart_connect 生效）"
          else
            echo "::warning::10801 未监听，引擎可能未自动启动"
          fi

          kill -TERM "$PID" 2>/dev/null || true
          sleep 2
          kill -9 "$PID" 2>/dev/null || true
          echo "图形界面版启动测试通过"

      - name: 上传日志
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: gui-smoke-logs
          path: /tmp/gui/*.log
          if-no-files-found: ignore
          retention-days: 14

  build:
    name: 构建 ${{ matrix.name }}
    needs: [check, smoke, gui-smoke]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows-x64
            bundles: nsis
          - os: ubuntu-22.04
            name: linux-x64
            bundles: appimage,deb
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: 安装 Linux 依赖
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            patchelf libssl-dev libgtk-3-dev build-essential curl wget file

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust 缓存
        uses: Swatinem/rust-cache@v2

      - name: 安装 Node
        uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: 安装 Tauri CLI
        run: npm install -g "@tauri-apps/cli@^2"

      # 仓库不提交二进制图标：先用脚本生成源 PNG，再展开成各平台图标
      - name: 生成图标
        run: |
          node scripts/gen-icon.js icon-source.png
          tauri icon icon-source.png -o src-tauri/icons

      - name: 构建图形界面版本
        run: tauri build --bundles ${{ matrix.bundles }}

      - name: 构建无 GUI 版本
        run: cargo build --release -p t5-daemon

      - name: 上传构建产物
        uses: actions/upload-artifact@v5
        with:
          name: cloudnproxy-${{ matrix.name }}
          if-no-files-found: ignore
          retention-days: 14
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/deb/*.deb
            target/release/cloudnproxy
            target/release/cloudnproxy.exe
            target/release/t5d
            target/release/t5d.exe

  # 静态链接版本：一个文件拷到任何 x86_64 Linux 都能跑
  musl:
    name: 静态链接版本（musl）
    needs: check
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      - name: 安装 Rust 与 musl target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - name: Rust 缓存
        uses: Swatinem/rust-cache@v2
        with:
          key: musl

      # ring 等加密库含汇编/C 代码，静态编译需要 musl-gcc 与相关工具
      - name: 安装 musl 工具链
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools cmake nasm perl

      - name: 构建
        run: cargo build --release --target x86_64-unknown-linux-musl -p t5-daemon

      # 注意：static-pie 二进制在 ldd 下显示为 "statically linked"，
      # 完全静态显示为 "not a dynamic executable"，因此统一用 readelf 判断
      # 是否存在 NEEDED（动态依赖）条目，两种表述都能正确识别。
      - name: 验证零动态依赖
        run: |
          BIN=target/x86_64-unknown-linux-musl/release/t5d
          file "$BIN"
          echo "ldd: $(ldd "$BIN" 2>&1 || true)"
          if readelf -d "$BIN" 2>/dev/null | grep -q '(NEEDED)'; then
            echo "::error::仍存在动态依赖，静态链接未生效"
            readelf -d "$BIN" | grep '(NEEDED)' || true
            exit 1
          fi
          echo "已确认零动态依赖（不存在任何 NEEDED 条目）"

      - name: 在 alpine 容器中验证可运行
        run: |
          set -o pipefail
          mkdir -p /tmp/musl
          cat > /tmp/musl/config.toml <<'EOF'
          listen_host = "127.0.0.1"
          listen_port = 11090
          resolve_domain = "cloudnproxy.baidu.com"
          upstream = "163.177.17.189:443"
          fake_host = "cloudnproxy.baidu.com"
          t5_auth = "1050504963"
          log_level = "info"
          log_file = ""
          EOF

          chmod +x target/x86_64-unknown-linux-musl/release/t5d
          echo "alpine 版本：$(docker run --rm alpine:latest cat /etc/alpine-release)"

          docker run -d --name t5d-musl --network host \
            -v /tmp/musl/config.toml:/cfg/config.toml:ro \
            -v "$PWD/target/x86_64-unknown-linux-musl/release/t5d:/t5d:ro" \
            alpine:latest /t5d -f /cfg/config.toml -log info

          ready=0
          for i in $(seq 1 15); do
            if (ss -ltn 2>/dev/null || netstat -ltn) | grep -q 11090; then
              echo "端口在 ${i} 秒内就绪"
              ready=1
              break
            fi
            sleep 1
          done

          echo "--- 容器日志 ---"
          docker logs t5d-musl 2>&1 || true

          if [ "$ready" -ne 1 ]; then
            echo "::error::静态二进制在 alpine 中未能启动"
            docker rm -f t5d-musl >/dev/null 2>&1 || true
            exit 1
          fi
          echo "已确认静态二进制可在 musl libc 环境（alpine）中运行"
          docker rm -f t5d-musl >/dev/null 2>&1 || true

      - name: 改名以免与动态版重名
        run: cp target/x86_64-unknown-linux-musl/release/t5d t5d-musl

      - name: 上传构建产物
        uses: actions/upload-artifact@v5
        with:
          name: cloudnproxy-linux-musl
          path: t5d-musl
          if-no-files-found: error
          retention-days: 14

  release:
    name: 发布 Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, musl]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      # 只取构建产物；pattern 会把冒烟测试日志（daemon-smoke-logs）排除在外
      - name: 下载构建产物
        uses: actions/download-artifact@v5
        with:
          path: artifacts
          merge-multiple: true
          pattern: cloudnproxy-*

      - name: 创建 Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
