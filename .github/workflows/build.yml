name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  # 先跑编译与单元测试，失败就不再浪费构建机时
  check:
    name: 编译检查与单元测试
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      - name: 安装 Linux 依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            patchelf libssl-dev libgtk-3-dev build-essential

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust 缓存
        uses: Swatinem/rust-cache@v2

      - name: 引擎单元测试
        run: cargo test -p t5-core --lib

      - name: 无 GUI 版本单元测试
        run: cargo test -p t5-daemon

      - name: 安装 Node
        uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: 安装 Tauri CLI
        run: npm install -g "@tauri-apps/cli@^2"

      # generate_context!() 在编译期就要读取图标，所以类型检查前必须先产出
      - name: 生成图标
        run: |
          node scripts/gen-icon.js icon-source.png
          tauri icon icon-source.png -o src-tauri/icons

      - name: 全量类型检查
        run: cargo check --workspace --all-targets

  # 真正启动无 GUI 版本，验证监听、日志与代理链路
  smoke:
    name: 无 GUI 版本冒烟测试
    needs: check
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust 缓存
        uses: Swatinem/rust-cache@v2

      # daemon 不依赖 WebView，因此这一步不需要任何图形库
      - name: 构建无 GUI 版本
        run: cargo build --release -p t5-daemon

      - name: 准备配置
        run: |
          mkdir -p /tmp/cnp
          cat > /tmp/cnp/config.toml <<'EOF'
          listen_host = "127.0.0.1"
          listen_port = 11080
          resolve_domain = "cloudnproxy.baidu.com"
          upstream = "163.177.17.189:443"
          fake_host = "cloudnproxy.baidu.com"
          t5_auth = "1050504963"
          chain_enabled = false
          chain_addr = ""
          tunnel_pool = true
          auto_reconnect = true
          auto_switch = false
          log_level = "info"
          log_file = "/tmp/cnp/t5d.log"
          EOF

      - name: 启动并验证
        run: |
          set -o pipefail
          ./target/release/t5d -f /tmp/cnp/config.toml -log debug > /tmp/cnp/stdout.log 2>&1 &
          echo $! > /tmp/cnp/t5d.pid

          echo "=========== 端口就绪探测 ==========="
          echo "（节点解析已移到后台，端口应秒级就绪）"
          ready=0
          for i in $(seq 1 15); do
            if (ss -ltn 2>/dev/null || netstat -ltn) | grep -q 11080; then
              echo "端口在 ${i} 秒内就绪"
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            echo "::error::11080 端口未监听，daemon 未正常启动"
            cat /tmp/cnp/stdout.log
            exit 1
          fi

          echo "=========== 标准输出日志 ==========="
          cat /tmp/cnp/stdout.log

          echo "=========== 日志文件 ==========="
          if [ -s /tmp/cnp/t5d.log ]; then
            tail -n 15 /tmp/cnp/t5d.log
            echo "日志文件写入正常"
          else
            echo "::error::日志文件为空，log_file 未生效"; exit 1
          fi

          echo "=========== SOCKS5 连通性（软检查）==========="
          curl -s -m 12 --socks5-hostname 127.0.0.1:11080 http://ip-api.com/json/ \
            && echo "代理链路可用" \
            || echo "::warning::代理连通性未通过（CI 网络环境限制，不判定构建失败）"

          echo "=========== 优雅停止 ==========="
          kill -TERM "$(cat /tmp/cnp/t5d.pid)" 2>/dev/null || true
          sleep 2
          if kill -0 "$(cat /tmp/cnp/t5d.pid)" 2>/dev/null; then
            echo "::warning::daemon 未在 SIGTERM 后退出，强制结束"
            kill -9 "$(cat /tmp/cnp/t5d.pid)" 2>/dev/null || true
          else
            echo "已优雅退出"
          fi
          echo "--- 停止后的日志尾部 ---"
          tail -n 5 /tmp/cnp/stdout.log

      - name: 上传测试日志
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: daemon-smoke-logs
          path: /tmp/cnp/*.log
          if-no-files-found: ignore
          retention-days: 14

  build:
    name: 构建 ${{ matrix.name }}
    needs: [check, smoke]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows-x64
            bundles: nsis
          - os: ubuntu-22.04
            name: linux-x64
            bundles: appimage,deb
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: 安装 Linux 依赖
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            patchelf libssl-dev libgtk-3-dev build-essential curl wget file

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust 缓存
        uses: Swatinem/rust-cache@v2

      - name: 安装 Node
        uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: 安装 Tauri CLI
        run: npm install -g "@tauri-apps/cli@^2"

      # 仓库不提交二进制图标：先用脚本生成源 PNG，再展开成各平台图标
      - name: 生成图标
        run: |
          node scripts/gen-icon.js icon-source.png
          tauri icon icon-source.png -o src-tauri/icons

      - name: 构建图形界面版本
        run: tauri build --bundles ${{ matrix.bundles }}

      - name: 构建无 GUI 版本
        run: cargo build --release -p t5-daemon

      - name: 上传构建产物
        uses: actions/upload-artifact@v5
        with:
          name: cloudnproxy-${{ matrix.name }}
          if-no-files-found: ignore
          retention-days: 14
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/deb/*.deb
            target/release/cloudnproxy
            target/release/cloudnproxy.exe
            target/release/t5d
            target/release/t5d.exe

  release:
    name: 发布 Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: 下载全部构建产物
        uses: actions/download-artifact@v5
        with:
          path: artifacts
          merge-multiple: true

      - name: 创建 Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
