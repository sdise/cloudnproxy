name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  # 先跑编译与单元测试，失败就不再浪费构建机时
  check:
    name: 编译检查与单元测试
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      - name: 安装 Linux 依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            patchelf libssl-dev libgtk-3-dev build-essential

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust 缓存
        uses: Swatinem/rust-cache@v2

      - name: 引擎单元测试
        run: cargo test -p t5-core --lib

      - name: 无 GUI 版本单元测试
        run: cargo test -p t5-daemon

      - name: 安装 Node
        uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: 安装 Tauri CLI
        run: npm install -g "@tauri-apps/cli@^2"

      # generate_context!() 在编译期就要读取图标，所以类型检查前必须先产出
      - name: 生成图标
        run: |
          node scripts/gen-icon.js icon-source.png
          tauri icon icon-source.png -o src-tauri/icons

      - name: 全量类型检查
        run: cargo check --workspace --all-targets

  # 真正启动无 GUI 版本，验证监听、日志与代理链路
  smoke:
    name: 无 GUI 版本冒烟测试
    needs: check
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust 缓存
        uses: Swatinem/rust-cache@v2

      # daemon 不依赖 WebView，因此这一步不需要任何图形库
      - name: 构建无 GUI 版本
        run: cargo build --release -p t5-daemon

      - name: 准备配置
        run: |
          mkdir -p /tmp/cnp
          cat > /tmp/cnp/config.toml <<'EOF'
          listen_host = "127.0.0.1"
          listen_port = 11080
          resolve_domain = "cloudnproxy.baidu.com"
          upstream = "163.177.17.189:443"
          fake_host = "cloudnproxy.baidu.com"
          t5_auth = "1050504963"
          chain_enabled = false
          chain_addr = ""
          tunnel_pool = true
          auto_reconnect = true
          auto_switch = false
          log_level = "info"
          log_file = "/tmp/cnp/t5d.log"
          EOF

      - name: 启动并验证
        run: |
          set -o pipefail
          ./target/release/t5d -f /tmp/cnp/config.toml -log debug > /tmp/cnp/stdout.log 2>&1 &
          echo $! > /tmp/cnp/t5d.pid

          echo "=========== 端口就绪探测 ==========="
          echo "（节点解析已移到后台，端口应秒级就绪）"
          ready=0
          for i in $(seq 1 15); do
            if (ss -ltn 2>/dev/null || netstat -ltn) | grep -q 11080; then
              echo "端口在 ${i} 秒内就绪"
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            echo "::error::11080 端口未监听，daemon 未正常启动"
            cat /tmp/cnp/stdout.log
            exit 1
          fi

          echo "=========== 标准输出日志 ==========="
          cat /tmp/cnp/stdout.log

          echo "=========== 日志文件 ==========="
          if [ -s /tmp/cnp/t5d.log ]; then
            tail -n 15 /tmp/cnp/t5d.log
            echo "日志文件写入正常"
          else
            echo "::error::日志文件为空，log_file 未生效"; exit 1
          fi

          echo "=========== SOCKS5 连通性（软检查）==========="
          curl -s -m 12 --socks5-hostname 127.0.0.1:11080 http://ip-api.com/json/ \
            && echo "代理链路可用" \
            || echo "::warning::代理连通性未通过（CI 网络环境限制，不判定构建失败）"

          echo "=========== 优雅停止 ==========="
          kill -TERM "$(cat /tmp/cnp/t5d.pid)" 2>/dev/null || true
          sleep 2
          if kill -0 "$(cat /tmp/cnp/t5d.pid)" 2>/dev/null; then
            echo "::warning::daemon 未在 SIGTERM 后退出，强制结束"
            kill -9 "$(cat /tmp/cnp/t5d.pid)" 2>/dev/null || true
          else
            echo "已优雅退出"
          fi
          echo "--- 停止后的日志尾部 ---"
          tail -n 5 /tmp/cnp/stdout.log

      - name: 上传测试日志
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: daemon-smoke-logs
          path: /tmp/cnp/*.log
          if-no-files-found: ignore
          retention-days: 14

  build:
    name: 构建 ${{ matrix.name }}
    needs: [check, smoke]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows-x64
            bundles: nsis
          - os: ubuntu-22.04
            name: linux-x64
            bundles: appimage,deb
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: 安装 Linux 依赖
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            patchelf libssl-dev libgtk-3-dev build-essential curl wget file

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust 缓存
        uses: Swatinem/rust-cache@v2

      - name: 安装 Node
        uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: 安装 Tauri CLI
        run: npm install -g "@tauri-apps/cli@^2"

      # 仓库不提交二进制图标：先用脚本生成源 PNG，再展开成各平台图标
      - name: 生成图标
        run: |
          node scripts/gen-icon.js icon-source.png
          tauri icon icon-source.png -o src-tauri/icons

      - name: 构建图形界面版本
        run: tauri build --bundles ${{ matrix.bundles }}

      - name: 构建无 GUI 版本
        run: cargo build --release -p t5-daemon

      - name: 上传构建产物
        uses: actions/upload-artifact@v5
        with:
          name: cloudnproxy-${{ matrix.name }}
          if-no-files-found: ignore
          retention-days: 14
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/deb/*.deb
            target/release/cloudnproxy
            target/release/cloudnproxy.exe
            target/release/t5d
            target/release/t5d.exe

  # 静态链接版本：一个文件拷到任何 x86_64 Linux 都能跑
  musl:
    name: 静态链接版本（musl）
    needs: check
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      - name: 安装 Rust 与 musl target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - name: Rust 缓存
        uses: Swatinem/rust-cache@v2
        with:
          key: musl

      # ring 等加密库含汇编/C 代码，静态编译需要 musl-gcc 与相关工具
      - name: 安装 musl 工具链
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools cmake nasm perl

      - name: 构建
        run: cargo build --release --target x86_64-unknown-linux-musl -p t5-daemon

      # 注意：static-pie 二进制在 ldd 下显示为 "statically linked"，
      # 完全静态显示为 "not a dynamic executable"，因此统一用 readelf 判断
      # 是否存在 NEEDED（动态依赖）条目，两种表述都能正确识别。
      - name: 验证零动态依赖
        run: |
          BIN=target/x86_64-unknown-linux-musl/release/t5d
          file "$BIN"
          echo "ldd: $(ldd "$BIN" 2>&1 || true)"
          if readelf -d "$BIN" 2>/dev/null | grep -q '(NEEDED)'; then
            echo "::error::仍存在动态依赖，静态链接未生效"
            readelf -d "$BIN" | grep '(NEEDED)' || true
            exit 1
          fi
          echo "已确认零动态依赖（不存在任何 NEEDED 条目）"

      - name: 在 alpine 容器中验证可运行
        run: |
          set -o pipefail
          mkdir -p /tmp/musl
          cat > /tmp/musl/config.toml <<'EOF'
          listen_host = "127.0.0.1"
          listen_port = 11090
          resolve_domain = "cloudnproxy.baidu.com"
          upstream = "163.177.17.189:443"
          fake_host = "cloudnproxy.baidu.com"
          t5_auth = "1050504963"
          log_level = "info"
          log_file = ""
          EOF

          chmod +x target/x86_64-unknown-linux-musl/release/t5d
          echo "alpine 版本：$(docker run --rm alpine:latest cat /etc/alpine-release)"

          docker run -d --name t5d-musl --network host \
            -v /tmp/musl/config.toml:/cfg/config.toml:ro \
            -v "$PWD/target/x86_64-unknown-linux-musl/release/t5d:/t5d:ro" \
            alpine:latest /t5d -f /cfg/config.toml -log info

          ready=0
          for i in $(seq 1 15); do
            if (ss -ltn 2>/dev/null || netstat -ltn) | grep -q 11090; then
              echo "端口在 ${i} 秒内就绪"
              ready=1
              break
            fi
            sleep 1
          done

          echo "--- 容器日志 ---"
          docker logs t5d-musl 2>&1 || true

          if [ "$ready" -ne 1 ]; then
            echo "::error::静态二进制在 alpine 中未能启动"
            docker rm -f t5d-musl >/dev/null 2>&1 || true
            exit 1
          fi
          echo "已确认静态二进制可在 musl libc 环境（alpine）中运行"
          docker rm -f t5d-musl >/dev/null 2>&1 || true

      - name: 改名以免与动态版重名
        run: cp target/x86_64-unknown-linux-musl/release/t5d t5d-musl

      - name: 上传构建产物
        uses: actions/upload-artifact@v5
        with:
          name: cloudnproxy-linux-musl
          path: t5d-musl
          if-no-files-found: error
          retention-days: 14

  release:
    name: 发布 Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, musl]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      # 只取构建产物；pattern 会把冒烟测试日志（daemon-smoke-logs）排除在外
      - name: 下载构建产物
        uses: actions/download-artifact@v5
        with:
          path: artifacts
          merge-multiple: true
          pattern: cloudnproxy-*

      - name: 创建 Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
