name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  # 先做一次快速的编译 + 单元测试，失败就不必浪费构建机时
  check:
    name: 编译检查与单元测试
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Linux 依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            patchelf libssl-dev libgtk-3-dev build-essential

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust 缓存
        uses: Swatinem/rust-cache@v2

      - name: t5-core 单元测试
        run: cargo test -p t5-core --lib

      - name: 全量类型检查
        run: cargo check --workspace --all-targets

  build:
    name: 构建 ${{ matrix.name }}
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows-x64
            bundles: nsis
          - os: ubuntu-22.04
            name: linux-x64
            bundles: appimage,deb
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Linux 依赖
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            patchelf libssl-dev libgtk-3-dev build-essential curl wget file

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust 缓存
        uses: Swatinem/rust-cache@v2

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 安装 Tauri CLI
        run: npm install -g "@tauri-apps/cli@^2"

      # 仓库里不提交二进制图标：先由脚本生成源 PNG，再展开成各平台图标
      - name: 生成图标
        run: |
          node scripts/gen-icon.js icon-source.png
          tauri icon icon-source.png -o src-tauri/icons

      - name: 构建应用
        run: tauri build --bundles ${{ matrix.bundles }}

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: cloudnproxy-${{ matrix.name }}
          if-no-files-found: ignore
          retention-days: 14
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/cloudnproxy
            src-tauri/target/release/cloudnproxy.exe

  # 打 tag 时自动发布到 GitHub Release
  release:
    name: 发布 Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: 下载全部构建产物
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: 创建 Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
